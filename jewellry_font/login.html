<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Gift Gallery</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">


    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">


        <div class="container">


            <a class="navbar-brand fw-bold fs-3" href="index.html">

                🎁 Gift Gallery

            </a>


            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>



            <div class="collapse navbar-collapse" id="menu">


                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a class="nav-link" href="index.html">

                            Home

                        </a>

                    </li>



                    <li class="nav-item">

                        <a class="nav-link" href="products.html">

                            Products

                        </a>

                    </li>



                    <li class="nav-item">

                        <a class="nav-link active" href="login.html">

                            Login

                        </a>

                    </li>



                    <li class="nav-item">

                        <a class="nav-link" href="register.html">

                            Register

                        </a>

                    </li>



                </ul>


            </div>


        </div>


    </nav>




    <!-- Login Section -->


    <section class="login-section">


        <div class="container">


            <div class="row justify-content-center">


                <div class="col-lg-5 col-md-7">



                    <div class="card login-card shadow border-0">


                        <div class="card-body p-5">



                            <div class="text-center mb-4">


                                <h2 class="fw-bold">

                                    Welcome Back

                                </h2>


                                <p class="text-muted">

                                    Login to your Gift Gallery account

                                </p>


                            </div>





                            <form>


                                <!-- Email -->


                                <div class="mb-3">


                                    <label class="form-label">

                                        Email Address

                                    </label>


                                    <div class="input-group">


                                        <span class="input-group-text">

                                            <i class="fa-solid fa-envelope"></i>

                                        </span>


                                        <input type="email" class="form-control" placeholder="Enter your email">


                                    </div>


                                </div>





                                <!-- Password -->


                                <div class="mb-3">


                                    <label class="form-label">

                                        Password

                                    </label>


                                    <div class="input-group">


                                        <span class="input-group-text">

                                            <i class="fa-solid fa-lock"></i>

                                        </span>


                                        <input type="password" class="form-control" placeholder="Enter password">


                                    </div>


                                </div>





                                <!-- Remember -->


                                <div class="d-flex justify-content-between mb-3">


                                    <div class="form-check">


                                        <input class="form-check-input" type="checkbox">


                                        <label class="form-check-label">

                                            Remember Me

                                        </label>


                                    </div>



                                    <a href="#" class="text-danger">

                                        Forgot Password?

                                    </a>


                                </div>





                                <!-- Login Button -->


                                <button class="btn btn-danger w-100 btn-lg">


                                    Login

                                    <i class="fa-solid fa-right-to-bracket"></i>


                                </button>





                                <hr class="my-4">





                                <p class="text-center">

                                    Or Login With

                                </p>




                                <div class="d-flex gap-2">


                                    <button type="button" class="btn btn-primary w-50">


                                        <i class="fa-brands fa-facebook"></i>

                                        Facebook


                                    </button>




                                    <button type="button" class="btn btn-dark w-50">


                                        <i class="fa-brands fa-google"></i>

                                        Google


                                    </button>


                                </div>






                                <p class="text-center mt-4">


                                    Don't have an account?


                                    <a href="register.html" class="text-danger fw-bold">


                                        Create Account


                                    </a>


                                </p>




                            </form>




                        </div>


                    </div>



                </div>


            </div>


        </div>


    </section>





    <!-- Footer -->


    <footer class="bg-dark text-white text-center py-4">


        <p class="mb-0">

            © 2026 Gift Gallery | All Rights Reserved

        </p>


    </footer>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
