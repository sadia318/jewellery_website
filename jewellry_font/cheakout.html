<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Gift Gallery</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">


    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">


        <div class="container">


            <a class="navbar-brand fw-bold fs-3" href="index.html">

                🎁 Gift Gallery

            </a>


            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">


                <span class="navbar-toggler-icon"></span>


            </button>



            <div class="collapse navbar-collapse" id="menu">


                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a class="nav-link" href="index.html">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link" href="products.html">

                            Products

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link" href="cart.html">

                            Cart

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link active" href="checkout.html">

                            Checkout

                        </a>

                    </li>


                </ul>


            </div>


        </div>


    </nav>



    <!-- Header -->


    <section class="bg-danger text-white py-5">


        <div class="container text-center">


            <h1 class="fw-bold">

                Checkout

            </h1>


            <p>

                Complete your order

            </p>


        </div>


    </section>




    <!-- Checkout Area -->


    <div class="container my-5">


        <div class="row g-4">



            <!-- Customer Information -->


            <div class="col-lg-7">


                <div class="card shadow border-0">


                    <div class="card-body">


                        <h3 class="mb-4">

                            Billing Details

                        </h3>



                        <div class="row">


                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    First Name

                                </label>


                                <input type="text" class="form-control" placeholder="Enter First Name">


                            </div>



                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    Last Name

                                </label>


                                <input type="text" class="form-control" placeholder="Enter Last Name">


                            </div>



                        </div>




                        <div class="mb-3">


                            <label class="form-label">

                                Email Address

                            </label>


                            <input type="email" class="form-control" placeholder="example@gmail.com">


                        </div>





                        <div class="mb-3">


                            <label class="form-label">

                                Phone Number

                            </label>


                            <input type="number" class="form-control" placeholder="01XXXXXXXXX">


                        </div>





                        <div class="mb-3">


                            <label class="form-label">

                                Full Address

                            </label>


                            <textarea class="form-control" rows="4" placeholder="Enter your address"></textarea>


                        </div>




                        <div class="mb-3">


                            <label class="form-label">

                                City

                            </label>


                            <select class="form-select">


                                <option>Dhaka</option>

                                <option>Chittagong</option>

                                <option>Rajshahi</option>

                                <option>Khulna</option>


                            </select>


                        </div>




                    </div>


                </div>


            </div>





            <!-- Order Summary -->


            <div class="col-lg-5">


                <div class="card shadow border-0">


                    <div class="card-body">


                        <h3 class="mb-4">

                            Your Order

                        </h3>



                        <div class="d-flex justify-content-between">


                            <span>

                                Luxury Rose Box

                            </span>


                            <span>

                                ৳1250

                            </span>


                        </div>


                        <hr>



                        <div class="d-flex justify-content-between">


                            <span>

                                Teddy Combo

                            </span>


                            <span>

                                ৳950

                            </span>


                        </div>


                        <hr>




                        <div class="d-flex justify-content-between">


                            <strong>

                                Subtotal

                            </strong>


                            <strong>

                                ৳2200

                            </strong>


                        </div>




                        <div class="d-flex justify-content-between mt-3">


                            <strong>

                                Delivery Charge

                            </strong>


                            <strong>

                                ৳100

                            </strong>


                        </div>




                        <hr>




                        <div class="d-flex justify-content-between">


                            <h5>

                                Total

                            </h5>


                            <h5 class="text-danger">

                                ৳2300

                            </h5>


                        </div>




                        <h5 class="mt-4">

                            Payment Method

                        </h5>



                        <div class="form-check">

                            <input class="form-check-input" type="radio" name="payment" checked>


                            <label class="form-check-label">

                                Cash On Delivery

                            </label>

                        </div>




                        <div class="form-check">

                            <input class="form-check-input" type="radio" name="payment">


                            <label class="form-check-label">

                                Bkash / Nagad

                            </label>

                        </div>




                        <button class="btn btn-danger w-100 mt-4 btn-lg">


                            Place Order

                            <i class="fa-solid fa-check"></i>


                        </button>



                    </div>


                </div>


            </div>


        </div>


    </div>




    <!-- Footer -->


    <footer class="bg-dark text-white text-center py-4">


        <p class="mb-0">

            © 2026 Gift Gallery | All Rights Reserved

        </p>


    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
